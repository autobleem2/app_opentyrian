# app_opentyrian CI: a host build, then the OpenTyrian App for every target in the shared image
# (ci/build.sh), one Store package per platform - opentyrian-<key>-<version>.zip, laid out as Apps/opentyrian/.
# A v* tag publishes them as a release; develop keeps the rolling `nightly` pre-release current. Gated by
# AB_CI_ENABLED, like every autobleem2 repository.
name: build
on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
# a container job's steps run under sh unless told otherwise, and sh has no [[ ]] - the tag test in "Version"
# failed quietly and a v* tag was versioned like a nightly
defaults:
  run:
    shell: bash
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'develop' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "AB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else echo "AB_VERSION=$(sed -n 's/^Version=//p' resources/app.ini)-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"; fi
      - name: Host build (native)
        run: ci/build.sh native
      - name: The console (psc)
        run: ci/build.sh psc
      - name: Raspberry Pi (rpi, rpi64)
        run: ci/build.sh rpi rpi64
      - name: The PC stick (pcusb)
        run: ci/build.sh pcusb
      - name: Windows (win)
        run: ci/build.sh win
      - uses: actions/upload-artifact@v7
        with:
          name: opentyrian-packages
          path: dist/*.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: opentyrian-packages, path: out }
      - name: Attach to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # the version is upstream's plus our package revision (v2.1.20260913-1), so a hyphen alone is no
          # pre-release; only an alpha/beta/rc/pre suffix is
          prerelease=""; case "${GITHUB_REF_NAME}" in *-alpha*|*-beta*|*-rc*|*-pre*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "OpenTyrian ${GITHUB_REF_NAME}" --generate-notes $prerelease out/*.zip || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" out/*.zip --clobber

  nightly:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: opentyrian-packages, path: out }
      - uses: autobleem2/autobleem-build/.github/actions/nightly-release@develop
        with:
          files: out/*.zip
