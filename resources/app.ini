[app]
Title=Tyrian (OpenTyrian)
Author=The OpenTyrian team; Tyrian by Jason Emery (World Tree Games), 1995
Version=2.1.20260913-2
Image=icon.png
Readme=readme.txt
# the program for this machine (the launcher's docs/app-format-plan.md): bin/psc/opentyrian on the console,
# bin/rpi, bin/rpi64, bin/pcusb on the appliances, bin/win/opentyrian.exe on Windows
Exec=bin/{key}/opentyrian
# the game data is shared by every platform; the launcher starts the program in this folder
Args=-t data
# SDL2_net, built with the program; SDL2 itself is the launcher's (the console) or the system's
Lib=lib/{key}
# OpenTyrian reads the raw joystick API and knows no PSC pad: the virtual pad shows it an Xbox 360 pad, which
# our patch lays out as the PlayStation Classic controls (patches/opentyrian/0001-psc-default-pad-layout.patch)
VirtualPad=true
Kernel=false
